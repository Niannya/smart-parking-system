# 数据库集成测试配置（成员 3 测试）
# 本地无 PostgreSQL 时集成测试按假设跳过；在组员机器上配置环境变量后运行：
#   set PARKING_DB_URL=jdbc:postgresql://localhost:5432/smart_parking_test
#   set PARKING_DB_USER=postgres
#   set PARKING_DB_PASSWORD=<本机口令>
# 测试会在 @BeforeAll 重建 schema 并写入演示数据（空库要求）。
spring.datasource.url=${PARKING_DB_URL:jdbc:postgresql://localhost:5432/smart_parking_test}
spring.datasource.username=${PARKING_DB_USER:postgres}
spring.datasource.password=${PARKING_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.example.backend.mapper=WARN
