# 服务器端口（与前端 Vite 代理一致）
server.port=8081

# 数据源：默认值面向本地空库；连接信息从本机环境变量读取，不提交真实口令
spring.datasource.url=${PARKING_DB_URL:jdbc:postgresql://localhost:5432/smart_parking}
spring.datasource.username=${PARKING_DB_USER:postgres}
spring.datasource.password=${PARKING_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis：下划线转驼峰；XML 映射文件位置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.backend

# 请求含未知 JSON 字段直接拒绝（400），符合 01 契约“请求未知字段直接拒绝”
spring.jackson.deserialization.fail-on-unknown-properties=true
# 注意：不配置 default-property-inclusion=non_null —— 01 契约要求失败壳 data:null、
# DTO 中 payment/effectiveTo/estimatedAmountDue 等 null 必须显式返回

# 打印 SQL 仅限开发期排查（生产关闭）
logging.level.org.example.backend.mapper=DEBUG
